# CEHR-BERT Fine-tuning Test Configuration
model_name_or_path: "models/cehrbert_omop"
tokenizer_name_or_path: "models/cehrbert_omop"

# Data configuration
data_folder: "data/finetune"
dataset_prepared_path: "data/dataset_prepared_finetune_test"
validation_split_percentage: 0.2
preprocessing_num_workers: 1
preprocessing_batch_size: 100
streaming: false

# Task configuration handled by model config

# Training configuration
do_train: true
do_eval: true
overwrite_output_dir: true
seed: 42

# Output directory
output_dir: "models/cehrbert_finetune_test"

# Training hyperparameters
eval_strategy: "steps"
save_strategy: "steps"
learning_rate: 0.00005
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 1
num_train_epochs: 3
# max_steps: 50  # Quick test

# Optimization
warmup_steps: 10
weight_decay: 0.01
logging_dir: "./logs_finetune_test"
logging_steps: 10
save_total_limit: 1
eval_steps: 25
save_steps: 25
report_to: "wandb"

# Mixed precision training
fp16: false  # Disable for test

# Early stopping
use_early_stopping: true
early_stopping_patience: 3
metric_for_best_model: "eval_loss"
greater_is_better: false

# Load best model at end
load_best_model_at_end: true
# CEHR-BERT Pretraining Configuration for OMOP Data
model_name_or_path: "models/cehrbert_omop"
tokenizer_name_or_path: "models/cehrbert_omop"

# Data configuration
data_folder: "data/omop/patient_sequences/sequences"
dataset_prepared_path: "data/dataset_prepared_omop"
validation_split_percentage: 0.1
preprocessing_num_workers: 4
preprocessing_batch_size: 1000
streaming: true

# Tokenizer configuration
vocab_size: 50000
min_frequency: 10

# Med-to-CehrBert arguments
att_function_type: "cehr_bert"
include_auxiliary_token: true
include_demographic_prompt: true

# Training configuration
do_train: true
overwrite_output_dir: true
seed: 42

# Model architecture
num_hidden_layers: 12
hidden_size: 768
max_position_embeddings: 2048

# Torch dataloader configs
dataloader_num_workers: 4

# Output directory
output_dir: "models/cehrbert_omop"

# Training hyperparameters
eval_strategy: "steps"
save_strategy: "steps"
learning_rate: 0.0001
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4
num_train_epochs: 3
max_steps: 100000  # Required for streaming datasets

# Optimization
warmup_steps: 1000
weight_decay: 0.01
adam_epsilon: 1e-8
adam_beta1: 0.9
adam_beta2: 0.999
max_grad_norm: 1.0

# Logging and saving
logging_dir: "./logs_pretrain_omop"
logging_steps: 1
save_total_limit: 3
eval_steps: 500
save_steps: 500
report_to: "wandb"  # or "wandb" if you have wandb set up

# Mixed precision training
fp16: true
fp16_opt_level: "O1"

# Early stopping
use_early_stopping: false
load_best_model_at_end: false

# Evaluation
metric_for_best_model: "eval_loss"
greater_is_better: false